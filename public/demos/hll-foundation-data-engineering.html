<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HLL Foundation · Data Engineering</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Geist Sans", system-ui, sans-serif;
        background: #fafafa;
        color: #111;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .panel {
        width: min(100%, 28rem);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 0.5rem;
        background: #fff;
        padding: 1.25rem;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      }
      .eyebrow {
        font-size: 0.625rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.125rem;
        font-weight: 500;
      }
      .flow {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }
      .node {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 0.875rem;
        border-radius: 0.375rem;
        background: #f5f5f5;
        animation: pulse 2.4s ease-in-out infinite;
      }
      .node:nth-child(2) {
        animation-delay: 0.4s;
      }
      .node:nth-child(3) {
        animation-delay: 0.8s;
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff5a1e, #eb3b3e);
        flex-shrink: 0;
      }
      .label {
        font-size: 0.8125rem;
        line-height: 1.4;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: translateY(0);
          opacity: 1;
        }
        50% {
          transform: translateY(-2px);
          opacity: 0.88;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <p class="eyebrow">Live pipeline preview</p>
      <h1>Data Engineering demo</h1>
      <div class="flow">
        <div class="node"><span class="dot"></span><span class="label">Ingest operational sources</span></div>
        <div class="node"><span class="dot"></span><span class="label">Transform &amp; validate in lakehouse</span></div>
        <div class="node"><span class="dot"></span><span class="label">Publish governed datasets</span></div>
      </div>
    </div>
  </body>
</html>
