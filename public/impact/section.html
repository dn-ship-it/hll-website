<!--
  HLL website section: "Impact"
  A knowledge graph in three layers. The word Impact sits at the centre, eight industries form the
  inner ring, nine services form the outer ring, and the clients surface in the centre when an
  industry is chosen. Every connection comes from real delivered work: CONFIG.clients lists each
  client, its industry, and the services we delivered to it (from "industry service client.xlsx").
  An industry connects to a service only when at least one client links the two.

  What happens on interaction
    - Industry: its clients rise into the centre under Impact. Lines draw from the industry to each
      client, then from each client to the services it bought.
    - Client (once surfaced): only that client's lines stay lit.
    - Service: the industries where we delivered it light up, with a line to each.
    - Services with no client in CONFIG yet (Artificial Intelligence, Ontology, Trust & Governance
      at the time of writing) stay on the ring without lines until a client is added.

  One graph engine, two layouts:
    - Landscape (desktop, laptop, tablet in landscape, phone in landscape): the wide layout.
    - Portrait, 820px wide or narrower (phones, tablets held upright): the same graph rearranged into a
      vertical frame close to 9:16, sized to fit one screen. Positions are percentages of the frame.

  Design authority: hll-website skill (references/design-system.md). Re-implemented in vanilla CSS,
  SVG, and canvas because the React components cannot be imported into the marketing site directly.
    Type: Aeonik Light 64px headline (30px on phone). Aeonik Regular for industry names (24px, 14px on
          phone) and client names (20px Paragraph, 12 to 14px on phone). Sometype Mono uppercase for
          service names (12px, 10px on phone). No weight above Medium.
    Markers: industries a filled dot, services a small square, clients a hollow ring in the industry colour.
    Colour: Dark Grey #1A1A1A, Mid Grey #949494, light ground only. Industry colours from the Figma
          "Industry Colours" frame (Consulting uses the "Consulting Firms" swatch #5cb3de). Service
          colours from VARIANT_GRADIENTS. No invented hex.
    Service colour mapping the reviewer should know:
      - Data Engineering: hll-foundation. Artificial Intelligence: hll-ai. Applications: hll-application.
        Ontology: hll-ontology. Trust & Governance: hll-trust. People: hll-people.
      - Analytics has no published variant, so it takes the neutral ink pair (#1A1A1A to #949494).
      - Experience Design sits in the same line as Applications (HLL Motion), so it uses the
        hll-application stops in reverse order (#72AAFF to #FF1F1F).
      - Cloud Engineering sits in the same line as Data Engineering (HLL Foundation), so it uses the
        hll-foundation stops in reverse order (#CC8B93 to #FF5A1E).
      - Public Sector uses the "Public Sector, External Affairs" swatch #ffba6e so it does not share
        #ffda52 with Payments on the same canvas.
    Breakpoints 820 and 1100 are inferred beyond the Figma artboards. Node drift and the moving canvas
    field are off below 820px and under prefers-reduced-motion; the connection lines still draw.

  Touch behaviour (phones and tablets)
    Press an industry and its clients rise while the lines draw. Lift the finger and the page opens.
    If the finger moves (a scroll), the press is cancelled and nothing opens. An industry with no URL
    stays open after the finger lifts, so its clients can be tapped. The section never blocks page
    scrolling, with a finger, a mouse wheel, or a trackpad.

  HOW TO EMBED
    1. Drop this whole block (style, section, script) into the page. Everything is scoped to .hll-www.
    2. Put the fonts folder next to the page, or change the four @font-face src paths below.
       If the site already loads Aeonik and Sometype Mono, delete the @font-face block.
    3. Fill in href for each industry, service, and client in CONFIG. A non-empty href makes that
       node a real link on every layout. A client href is the place for its case study.
    4. To add delivered work, add a row to CONFIG.clients. The lines follow automatically.
    5. Optional: listen for the "hll:industry-select" event on the section for analytics.
-->

<style>
  html, body { margin: 0; min-height: 100%; }

  /* ===== Fonts. Replace ./fonts/ with the site's font path, or delete if already loaded. ===== */
  @font-face { font-family: "Aeonik"; src: url("./fonts/Aeonik-Light.otf") format("opentype"); font-weight: 300; font-style: normal; font-display: swap; }
  @font-face { font-family: "Aeonik"; src: url("./fonts/Aeonik-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Aeonik"; src: url("./fonts/Aeonik-Medium.otf") format("opentype"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Sometype Mono"; src: url("./fonts/SometypeMono-VariableFont_wght.ttf") format("truetype"); font-weight: 400 500; font-style: normal; font-display: swap; }

  /* ===== Tokens (hll-website design-system.md). Do not add a hex that is not in that file. ===== */
  .hll-www {
    --hll-ink: #1A1A1A;
    --hll-ink-2: #949494;
    --hll-ground: #FFFFFF;
    --hll-hairline: rgba(26, 26, 26, 0.10);
    --hll-hairline-strong: rgba(26, 26, 26, 0.18);
    --hll-font: "Aeonik", "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hll-mono: "Sometype Mono", ui-monospace, monospace;
    --hll-radius: 6px;
    --hll-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --hll-gutter: clamp(16px, 4vw, 72px);
    --hll-max: 1400px;
    /* Connection line timing. Client-to-service lines start once the industry-to-client lines are underway. */
    --hll-line-ms: 598ms;
    --hll-line-fade-ms: 253ms;
    --hll-rest-fade-ms: 368ms;
    --hll-line-2-delay: 270ms;

    /* The industries menu gradient: headline reveal and canvas field */
    --hll-ind-a: #0352B2; --hll-ind-b: #037A9F; --hll-ind-c: #6460D5;

    position: relative;
    isolation: isolate;
    overflow: hidden;
    background: var(--hll-ground);
    color: var(--hll-ink);
    font-family: var(--hll-font);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    color-scheme: light;
  }
  .hll-www *, .hll-www *::before, .hll-www *::after { box-sizing: border-box; }

  /* ===== Ground: gradient field (canvas) under a fine grid ===== */
  .hll-www-field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .hll-www-field canvas { display: block; width: 100%; height: 100%; }
  .hll-www-field-static {
    background:
      radial-gradient(55% 60% at 22% 30%, rgba(3, 82, 178, 0.10), transparent 70%),
      radial-gradient(50% 55% at 78% 70%, rgba(100, 96, 213, 0.10), transparent 70%),
      var(--hll-ground);
  }
  .hll-www-grid {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, var(--hll-hairline) 1px, transparent 1px),
      linear-gradient(to bottom, var(--hll-hairline) 1px, transparent 1px);
    background-size: 72px 72px;
    background-position: center top;
    mask-image: radial-gradient(85% 85% at 50% 50%, #000 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(85% 85% at 50% 50%, #000 40%, transparent 100%);
    opacity: 0.7;
  }

  .hll-www-inner { position: relative; z-index: 1; max-width: var(--hll-max); margin: 0 auto; padding: 48px var(--hll-gutter); }

  /* ===== Stage: the graph ===== */
  .hll-www-stage { position: relative; height: clamp(580px, 82vh, 820px); }
  .hll-www-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .hll-www-lines line { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .hll-www-lines .rest { stroke: var(--hll-ink); stroke-opacity: 0.16; stroke-width: 1; transition: stroke-opacity var(--hll-rest-fade-ms) var(--hll-ease); }
  .hll-www-lines .pair {
    stroke-width: 1.25; stroke-opacity: 0; stroke-dasharray: 1; stroke-dashoffset: 1;
    transition: stroke-opacity var(--hll-line-fade-ms) var(--hll-ease), stroke-dashoffset var(--hll-line-ms) var(--hll-ease);
  }
  .hll-www-lines .pair.is-on { stroke-opacity: 0.95; stroke-dashoffset: 0; }
  .hll-www-lines .pair.cs.is-on { transition-delay: var(--hll-line-2-delay), var(--hll-line-2-delay); }
  .hll-www.has-active .hll-www-lines .rest { stroke-opacity: 0.06; }

  /* Centre headline: Aeonik Light 64px, line-height 100%, gradient reveal on entry.
     It lifts (and on phones shrinks a little) to make room when clients surface beneath it. */
  .hll-www-centre {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; text-align: center; white-space: nowrap;
    font-weight: 300; font-size: 64px; line-height: 1; letter-spacing: -0.01em; color: var(--hll-ink);
    padding: 10px 22px;
    transition: transform 460ms var(--hll-ease);
  }
  .hll-www-centre .rv {
    display: inline-block;
    background-image: linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 30%, var(--hll-ind-a) 40%, var(--hll-ind-b) 50%, var(--hll-ind-c) 60%, var(--hll-ink) 70%, var(--hll-ink) 100%);
    background-size: 340% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transition: background-position 1200ms var(--hll-ease);
  }
  .hll-www-centre.is-yield { opacity: 0; }
  .hll-www-centre { transition: transform 460ms var(--hll-ease), opacity 260ms var(--hll-ease); }
  .hll-www-centre.is-armed .rv { background-position: 0% 0; }
  .hll-www-centre.is-in .rv { background-position: 100% 0; }

  /* Nodes. Scrolling is never blocked: no touch-action lock, no preventDefault on press. */
  .hll-www-node {
    position: absolute; left: 0; top: 0;
    display: inline-flex; align-items: center; gap: 10px;
    transform: translate(-50%, -50%);
    text-decoration: none; color: var(--hll-ink); cursor: pointer; white-space: nowrap; text-align: left;
    padding: 6px 8px; border-radius: var(--hll-radius);
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    transition: opacity 260ms var(--hll-ease), color 260ms var(--hll-ease);
    will-change: transform;
  }
  .hll-www-node:focus { outline: none; }
  .hll-www-node:focus-visible { outline: 2px solid var(--hll-ink); outline-offset: 2px; }
  /* Nodes pinned to the left edge carry their dot on the inner side, so lines never cross the words */
  .hll-www-node.anchor-left { flex-direction: row-reverse; text-align: right; }
  .hll-www-node .m-br { display: none; }
  .hll-www.is-portrait .hll-www-node .m-br { display: inline; }
  .hll-www-node .dot {
    flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
    background: var(--c, var(--hll-ink));
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--hll-ink)) 30%, transparent);
    transition: box-shadow 320ms var(--hll-ease), transform 320ms var(--hll-ease), background 320ms var(--hll-ease);
  }
  .hll-www-node .lbl { position: relative; display: inline-block; }

  /* Industry nodes: Aeonik Regular 24px */
  .hll-www-node.is-industry { font-size: 24px; font-weight: 400; line-height: 1.1; }
  .hll-www-node.is-industry.is-active .dot { box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 22%, transparent); transform: scale(1.15); }
  .hll-www-node.is-industry.is-lit .dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 18%, transparent); }

  /* Service nodes: Sometype Mono 12px uppercase, Mid Grey at rest, the service gradient when lit */
  .hll-www-node.is-service {
    font-family: var(--hll-mono); font-size: 12px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hll-ink-2); line-height: 1.3;
  }
  .hll-www-node.is-service .dot { width: 7px; height: 7px; border-radius: 1.5px; background: var(--hll-ink-2); }
  .hll-www-node.is-service .lbl {
    background-image: var(--g); -webkit-background-clip: text; background-clip: text; color: inherit;
    transition: color 260ms var(--hll-ease);
  }
  .hll-www-node.is-service.is-lit, .hll-www-node.is-service.is-active { color: var(--hll-ink); }
  .hll-www-node.is-service.is-lit .lbl, .hll-www-node.is-service.is-active .lbl { color: transparent; }
  .hll-www-node.is-service.is-lit .dot, .hll-www-node.is-service.is-active .dot { background: var(--g); }
  .hll-www-node.is-service.is-active .dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ga) 18%, transparent); }

  /* Client nodes: hidden at rest, they surface (rise and fade in) when their industry is chosen.
     Aeonik Regular 20px (Paragraph) with a hollow ring in the industry colour. */
  .hll-www-node.is-client { font-size: 20px; line-height: 1.15; padding: 3px 6px; pointer-events: none; }
  .hll-www-node.is-client .in {
    display: inline-flex; align-items: center; gap: 10px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 280ms var(--hll-ease), transform 420ms var(--hll-ease);
  }
  .hll-www-node.is-client.is-shown { pointer-events: auto; }
  .hll-www-node.is-client.is-shown .in { opacity: 1; transform: none; transition-delay: var(--d, 0ms); }
  .hll-www-node.is-client .dot { width: 8px; height: 8px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
  .hll-www-node.is-client.is-active .dot { background: var(--c); }

  .hll-www.has-active .hll-www-node.is-dim { opacity: 0.28; }
  .hll-www.has-active .hll-www-node.is-client.is-dim { opacity: 0.45; }

  /* ===== Tablet step (inferred, 1100px) ===== */
  @media (max-width: 1100px) {
    .hll-www-stage { height: clamp(580px, 82vh, 760px); }
    .hll-www-centre { font-size: 48px; }
    .hll-www-node.is-industry { font-size: 20px; }
    .hll-www-node.is-service { font-size: 11px; }
    .hll-www-node.is-client { font-size: 16px; }
  }

  /* ===== Phone and tablet held upright (inferred, 820px): the vertical graph =====
     The frame is the smaller of one visible screen and 16/9 of its width, so it always fits one screen. */
  @media (max-width: 820px) and (orientation: portrait) {
    .hll-www-inner { padding: 16px var(--hll-gutter); }
    .hll-www-stage {
      height: calc(100vh - 32px);
      height: min(calc(100svh - 32px), calc((100vw - 2 * var(--hll-gutter)) * 16 / 9));
      min-height: 420px;
    }
    .hll-www-grid { background-size: 48px 48px; }
    .hll-www-centre { font-size: clamp(30px, 8vw, 48px); padding: 6px 12px; }
    .hll-www-node { gap: 7px; padding: 8px 6px; }
    .hll-www-node.is-industry { font-size: clamp(14px, 3.8vw, 20px); }
    .hll-www-node.is-service { font-size: clamp(10px, 2.7vw, 12px); letter-spacing: 0.06em; }
    .hll-www-node.is-client { font-size: clamp(12px, 3.6vw, 16px); line-height: 1.1; padding: 1px 4px; }
    .hll-www-node.is-client .in { gap: 7px; }
    .hll-www-node.is-industry .dot { width: 8px; height: 8px; }
    .hll-www-node.is-service .dot { width: 6px; height: 6px; }
    .hll-www-node.is-client .dot { width: 7px; height: 7px; }
    .hll-www-node.is-industry.is-active .dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 22%, transparent); }
  }

  /* Narrowest phones (320 to 359px, the original iPhone SE class): trim side padding so the middle row clears */
  @media (max-width: 359px) and (orientation: portrait) {
    .hll-www-centre { padding: 6px 8px; }
    .hll-www-node { padding: 8px 4px; }
    .hll-www-node.is-client { padding: 1px 4px; }
  }

  /* ===== Phone held sideways: the wide graph squeezed into one short screen ===== */
  @media (max-height: 500px) and (orientation: landscape) {
    .hll-www-inner { padding: 12px var(--hll-gutter); }
    .hll-www-stage { height: calc(100vh - 24px); height: max(320px, calc(100svh - 24px)); }
    .hll-www-centre { font-size: 36px; }
    .hll-www-node { padding: 4px 6px; }
    .hll-www-node.is-industry { font-size: 15px; }
    .hll-www-node.is-service { font-size: 10px; }
    .hll-www-node.is-client { font-size: 12px; padding: 1px 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hll-www * { transition-duration: 1ms !important; transition-delay: 0ms !important; animation-duration: 1ms !important; }
    .hll-www-centre .rv { background-position: 100% 0 !important; }
  }
</style>

<section class="hll-www" id="hll-impact" aria-labelledby="hll-www-title">
  <div class="hll-www-field hll-www-field-static" aria-hidden="true"><canvas></canvas></div>
  <div class="hll-www-grid" aria-hidden="true"></div>

  <div class="hll-www-inner">
    <div class="hll-www-stage" data-stage>
      <svg class="hll-www-lines" data-lines aria-hidden="true" focusable="false"><defs data-defs><mask data-mask maskUnits="userSpaceOnUse"><rect data-mask-all fill="#fff" x="0" y="0" width="100%" height="100%"></rect></mask></defs><g data-rest></g><g data-pairs></g></svg>
      <h2 class="hll-www-centre" id="hll-www-title" data-centre><span class="rv">Impact</span></h2>
      <!-- Industry, service, and client nodes are rendered here from CONFIG -->
    </div>
  </div>
</section>

<script>
(function () {

      "experience-design": { name: "Experience Design",       href: "/services/hll-application", a: "#72AAFF", b: "#FF1F1F", x: 7,    y: 52,   m: { x: 0, y: 50, anchor: "left", wrap: true } },

    },
    /* Delivered work, from "industry service client.xlsx" */

      { key: "principal-financial", name: "Principal Financial",   industry: "insurance",  href: "", services: ["analytics"] },

      var r = root.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) / r.width; mouse.y = (e.clientY - r.top) / r.height;

      if (!ctx || !motion) { if (field) field.classList.add("hll-www-field-static"); if (ctx) ctx.clearRect(0, 0, cw, ch); return; }
      field.classList.remove("hll-www-field-static");
      eased.x += (mouse.x - eased.x) * 0.04; eased.y += (mouse.y - eased.y) * 0.04;
      tintMix += ((fieldTint ? 1 : 0) - tintMix) * 0.06;
      ctx.clearRect(0, 0, cw, ch);
      ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, cw, ch);
      var cols = CONFIG.fieldColours;
      var pools = [
        { x: 0.22 + (eased.x - 0.5) * 0.18 + 0.03 * Math.sin(t * 0.00021), y: 0.32 + (eased.y - 0.5) * 0.14 + 0.03 * Math.cos(t * 0.00017), r: 0.55, c: cols[0], a: 0.10 },
        { x: 0.78 + (eased.x - 0.5) * 0.12 + 0.03 * Math.cos(t * 0.00019), y: 0.70 + (eased.y - 0.5) * 0.18 + 0.03 * Math.sin(t * 0.00023), r: 0.55, c: cols[2], a: 0.10 },
        { x: eased.x, y: eased.y, r: 0.34, c: cols[1], a: 0.07 }
      ];
      pools.forEach(function (p, i) {
        var col = (fieldTint && i === 2) ? fieldTint : p.c;
        var g = ctx.createRadialGradient(p.x * cw, p.y * ch, 0, p.x * cw, p.y * ch, p.r * Math.max(cw, ch));
        var alpha = p.a + (i === 2 ? tintMix * 0.08 : 0);
        g.addColorStop(0, hexA(col, alpha)); g.addColorStop(1, hexA(col, 0));

    }
    function hexA(hex, a) {
      var h = hex.replace("#", ""); if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
      var n = parseInt(h, 16);
      return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a.toFixed(3) + ")";
    }

    /* ---- Headline gradient reveal on entry ---- */
    if ("IntersectionObserver" in window && !reduce.matches) {
      centre.classList.add("is-armed");
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { requestAnimationFrame(function () { centre.classList.add("is-in"); }); io.disconnect(); } });
      }, { threshold: 0.4 });
      io.observe(centre);
    }

    /* ---- Frame loop: runs only while the section is on screen ---- */
    var visible = true, raf = 0;
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { visible = en.isIntersecting; if (visible && !raf) raf = requestAnimationFrame(tick); });
      }, { threshold: 0 }).observe(root);
    }
    function tick(t) {
      raf = 0;
      if (!visible) return;
      place(t); drawField(t);
      raf = requestAnimationFrame(tick);
    }
    function relayout() { measure(); place(performance.now()); }
    if ("ResizeObserver" in window) new ResizeObserver(relayout).observe(stage);
    else window.addEventListener("resize", relayout);
    listen(reduce, relayout); listen(narrow, relayout); listen(portrait, relayout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

    relayout(); drawField(performance.now());
    raf = requestAnimationFrame(tick);
  }
})();
</script>
